[package]
name = "cli"
version = "0.2.10-alpha.5"
edition = "2021"

[dependencies]
kumo-core = { path = "../core" }
resolver = { path = "../resolver" }
security = { path = "../security" }
serde_json = "1.0"
serde_yaml = "0.9"
blake3 = "1.3"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
indicatif = "0.17"
dirs = "5.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
num_cpus = "1.16"
semver = "1.0"
self-replace = "1.5"
zip = "0.6"
flate2 = "1.0"
tar = "0.4"
rayon = "1.8"
filetime = "0.2"
glob = "0.3.1"

[[bin]]
name = "kumo"
path = "src/main.rs"

[[bin]]
name = "kx"
path = "src/kx.rs"

[build-dependencies]
winres = "0.1"


