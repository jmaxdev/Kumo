[package]
name = "resolver"
version = "0.2.10-alpha.2"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
semver = { version = "1.0", features = ["serde"] }
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tokio = { version = "1.36", features = ["full"] }
serde_yaml = "0.9"
serde_json = "1.0"
dirs = "5.0"
futures = "0.3"



